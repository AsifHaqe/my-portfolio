<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Tic-Tac-Toe</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section>
            <h1 class="game-title">Tic-Tac-Toe</h1>
            <div class="game-container">
                <div class="cell" data-cell-index="0" aria-label="Cell 1"></div>
                <div class="cell" data-cell-index="1" aria-label="Cell 2"></div>
                <div class="cell" data-cell-index="2" aria-label="Cell 3"></div>
                <div class="cell" data-cell-index="3" aria-label="Cell 4"></div>
                <div class="cell" data-cell-index="4" aria-label="Cell 5"></div>
                <div class="cell" data-cell-index="5" aria-label="Cell 6"></div>
                <div class="cell" data-cell-index="6" aria-label="Cell 7"></div>
                <div class="cell" data-cell-index="7" aria-label="Cell 8"></div>
                <div class="cell" data-cell-index="8" aria-label="Cell 9"></div>
            </div>
            <h2 class="game-status" id="gameStatus">It's X's turn</h2>
            <button class="restart" type="button">Restart game</button>
        </section>
        <script src="script.js"></script>
    </body>
</html>
